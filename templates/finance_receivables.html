{% extends "base.html" %}
{% block title %}应收账款{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-cash-coin"></i> 应收账款</h4>
  <a href="/finance/invoices?type=ar" class="btn btn-sm btn-primary">开具销项发票</a>
</div>
<div class="card border-0 shadow-sm"><div class="card-body p-0">
<table class="table table-hover mb-0" id="partnerTable">
<thead><tr><th>编码</th><th>客户名称</th><th>联系人</th><th class="text-end">应收余额</th></tr></thead>
<tbody><tr><td colspan="4" class="text-center py-4 text-muted">加载中…</td></tr></tbody>
</table></div></div>
{% endblock %}
{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  fetch('/api/finance/partners?type=customer').then(r=>r.json()).then(d => {
    const tb = document.querySelector('#partnerTable tbody');
    if (!d.success) { tb.innerHTML = `<tr><td colspan="4">${d.error}</td></tr>`; return; }
    tb.innerHTML = (d.partners||[]).map(p => `<tr>
      <td>${p.code}</td><td>${p.name}</td><td>${p.contact||''}</td>
      <td class="text-end">${formatCurrency(p.balance)}</td></tr>`).join('') ||
      '<tr><td colspan="4" class="text-center text-muted py-4">暂无客户</td></tr>';
  });
});
</script>
{% endblock %}
