{% extends "base.html" %}
{% block title %}应付账款{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-credit-card"></i> 应付账款</h4>
  <a href="/finance/invoices?type=ap" class="btn btn-sm btn-primary">录入进项发票</a>
</div>
<div class="card border-0 shadow-sm"><div class="card-body p-0">
<table class="table table-hover mb-0" id="partnerTable">
<thead><tr><th>编码</th><th>供应商</th><th>联系人</th><th class="text-end">应付余额</th></tr></thead>
<tbody><tr><td colspan="4" class="text-center py-4 text-muted">加载中…</td></tr></tbody>
</table></div></div>
{% endblock %}
{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  fetch('/api/finance/partners?type=vendor').then(r=>r.json()).then(d => {
    const tb = document.querySelector('#partnerTable tbody');
    tb.innerHTML = (d.partners||[]).map(p => `<tr>
      <td>${p.code}</td><td>${p.name}</td><td>${p.contact||''}</td>
      <td class="text-end text-danger">${formatCurrency(Math.abs(p.balance))}</td></tr>`).join('') ||
      '<tr><td colspan="4" class="text-center text-muted py-4">暂无供应商</td></tr>';
  });
});
</script>
{% endblock %}
