{% extends "base.html" %}
{% block title %}审批中心{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-check2-square"></i> 审批中心</h4>
  <div class="btn-group btn-group-sm">
    <button class="btn btn-outline-primary active" onclick="loadAppr('pending', this)">待我审批</button>
    <button class="btn btn-outline-primary" onclick="loadAppr('mine', this)">全部</button>
  </div>
</div>
<div class="card border-0 shadow-sm"><div class="card-body p-0">
<table class="table table-hover mb-0"><thead>
<tr><th>标题</th><th>类型</th><th>状态</th><th>步骤</th><th>时间</th><th></th></tr>
</thead><tbody id="apprBody"><tr><td colspan="6" class="text-center py-4">加载中…</td></tr></tbody></table>
</div></div>
{% endblock %}
{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => loadAppr('pending'));
function loadAppr(scope, btn) {
  document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  fetch(`/api/workflow/approvals?scope=${scope}`).then(r=>r.json()).then(d => {
    document.getElementById('apprBody').innerHTML = (d.approvals||[]).map(a => `<tr>
      <td>${a.title}</td><td>${a.entity_type}</td>
      <td><span class="badge bg-${a.status==='approved'?'success':a.status==='rejected'?'danger':'warning'}">${a.status}</span></td>
      <td>${a.current_step}/${a.total_steps}</td><td class="small">${a.created_at}</td>
      <td>${a.status==='pending'?`<button class="btn btn-sm btn-success me-1" onclick="actAppr(${a.id},'approved')">同意</button>
        <button class="btn btn-sm btn-outline-danger" onclick="actAppr(${a.id},'rejected')">驳回</button>`:''}</td></tr>`).join('') ||
      '<tr><td colspan="6" class="text-center text-muted py-4">暂无审批</td></tr>';
  });
}
function actAppr(id, action) {
  const comment = prompt('审批意见（可选）', '') || '';
  fetch(`/api/workflow/approvals/${id}/${action}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ comment }) })
    .then(r=>r.json()).then(d => { if(d.success){ showToast('已处理','success'); loadAppr('pending'); } else alert(d.error); });
}
</script>
{% endblock %}
