{% extends "base.html" %}
{% block title %}数据预览 - 财务审计工作台{% endblock %}

{% block page_header %}
<div class="page-header">
  <div>
    <h1>数据预览</h1>
    <p class="page-desc">查看已导入数据的统计摘要与前 100 行明细</p>
  </div>
  <div class="page-actions">
    <a href="/dashboard" class="btn btn-outline-primary btn-sm"><i class="bi bi-speedometer2"></i> 仪表盘</a>
  </div>
</div>
{% endblock %}

{% block content %}
<div id="loadingArea" class="loading-state"><div class="spinner-border"></div><p class="mt-2">加载数据...</p></div>

<div id="previewContent" style="display:none">
  <div class="metric-grid" id="statsRow"></div>

  <div class="panel">
    <div class="panel-header">
      <span><i class="bi bi-list-ul"></i> 数据明细（前100行）</span>
      <span class="panel-sub" id="tableInfo"></span>
    </div>
    <div class="panel-body panel-body-flush">
      <div class="table-responsive">
        <table id="dataTable" class="table table-striped table-hover mb-0" style="width:100%"></table>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  fetch('/api/preview-data')
    .then(r => r.json())
    .then(data => {
      document.getElementById('loadingArea').style.display = 'none';
      if (!data.success) {
        document.getElementById('loadingArea').innerHTML = '<div class="alert alert-warning">未上传数据，请先 <a href="/">上传文件</a></div>';
        document.getElementById('loadingArea').style.display = 'block';
        return;
      }
      document.getElementById('previewContent').style.display = 'block';
      const s = data.summary;
      const rows = data.preview_data || [];
      const columns = data.preview_columns || [];

      let cards = '';
      cards += '<div class="metric-card accent"><div class="metric-value">' + (s.total_rows || 0).toLocaleString() + '</div><div class="metric-label">总行数</div></div>';
      cards += '<div class="metric-card info"><div class="metric-value">' + (s.total_columns || 0) + '</div><div class="metric-label">总列数</div></div>';
      cards += '<div class="metric-card warn"><div class="metric-value">' + (s.duplicate_rows || 0) + '</div><div class="metric-label">重复行</div></div>';
      if (s.amount_stats) {
        cards += '<div class="metric-card ok"><div class="metric-value">' + (s.amount_stats.total/10000).toFixed(1) + '万</div><div class="metric-label">金额合计</div></div>';
        cards += '<div class="metric-card"><div class="metric-value">' + (s.amount_stats.mean || 0).toFixed(2) + '</div><div class="metric-label">金额均值</div></div>';
      }
      if (s.date_range) {
        cards += '<div class="metric-card"><div class="metric-value" style="font-size:1rem">' + s.date_range.start + ' ~ ' + s.date_range.end + '</div><div class="metric-label">日期范围（' + s.date_range.days_span + '天）</div></div>';
      }
      document.getElementById('statsRow').innerHTML = cards;

      const badgeColors = {amount:'primary',date:'success',category:'info',voucher_id:'warning',unknown:'secondary'};
      let badges = '';
      if (s.column_types) {
        for (const [col, type] of Object.entries(s.column_types)) {
          badges += '<span class="badge bg-' + (badgeColors[type]||'secondary') + ' me-1">' + col + ': ' + type + '</span>';
        }
      }
      document.getElementById('tableInfo').innerHTML = badges;

      if (columns.length > 0 && rows.length > 0) {
        let thead = '<thead><tr><th>#</th>';
        columns.forEach(c => { thead += '<th>' + c + '</th>'; });
        thead += '</tr></thead>';

        let tbody = '<tbody>';
        rows.forEach((row, i) => {
          tbody += '<tr><td>' + (i + 1) + '</td>';
          columns.forEach(col => {
            const val = row[col];
            tbody += '<td>' + (val != null ? val : '') + '</td>';
          });
          tbody += '</tr>';
        });
        tbody += '</tbody>';

        document.getElementById('dataTable').innerHTML = thead + tbody;
      } else if (columns.length > 0) {
        let thead = '<thead><tr>';
        columns.forEach(c => { thead += '<th>' + c + '</th>'; });
        thead += '</tr></thead>';
        document.getElementById('dataTable').innerHTML = thead + '<tbody><tr><td colspan="' + columns.length + '" class="text-center text-muted">暂无预览数据，请返回<a href="/">上传页</a>重新上传</td></tr></tbody>';
      }
    })
    .catch(err => {
      document.getElementById('loadingArea').innerHTML = '<div class="alert alert-danger">加载失败: ' + err.message + '</div>';
    });
});
</script>
{% endblock %}
