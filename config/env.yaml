# 财务大数据审计系统 - 环境配置与测试说明
# 本文档描述 Docker 部署所需的环境变量、系统依赖及验证步骤

name: financial-audit-system
version: "2.1"

# ---------------------------------------------------------------------------
# 环境变量
# ---------------------------------------------------------------------------
environment:
  PORT:
    description: 容器内 Flask 监听端口
    default: "5000"
    required: false

  FLASK_DEBUG:
    description: 是否开启 Flask 调试模式（生产环境设为 0）
    default: "0"
    required: false
    values: ["0", "1"]

  DEEPSEEK_API_KEY:
    description: DeepSeek API Key，用于仪表盘 AI 审计助手
    default: ""
    required: false
    note: 不配置时 OCR、审计、历史记录功能仍可用，仅 AI 问答不可用

  HOST_PORT:
    description: docker-compose 宿主机映射端口（写在 .env 中）
    default: "5000"
    required: false

# ---------------------------------------------------------------------------
# 容器内系统依赖（已写入 Dockerfile，无需手动安装）
# ---------------------------------------------------------------------------
system_dependencies:
  - name: tesseract-ocr
    purpose: 图片识图 OCR
  - name: tesseract-ocr-chi-sim
    purpose: 中文 OCR 语言包
  - name: ffmpeg
    purpose: 语音录音格式转换（仪表盘 AI 语音提问）
  - name: curl
    purpose: 健康检查与冒烟测试

# ---------------------------------------------------------------------------
# Python 依赖（见 requirements.txt）
# ---------------------------------------------------------------------------
python_dependencies:
  - flask
  - pandas
  - numpy
  - openpyxl
  - scipy
  - pillow
  - pytesseract
  - SpeechRecognition
  - pydub
  - gunicorn
    note: 生产环境使用 1 worker（应用数据存于内存，多 worker 会不一致）

# ---------------------------------------------------------------------------
# 持久化数据卷
# ---------------------------------------------------------------------------
volumes:
  audit-uploads:
    mount: /app/uploads
    description: 用户上传的原始文件
  audit-data:
    mount: /app/data
    description: SQLite 历史记录数据库 (audit_history.db)

# ---------------------------------------------------------------------------
# 部署步骤
# ---------------------------------------------------------------------------
deploy:
  steps:
    - "cp .env.example .env"
    - "编辑 .env，填入 DEEPSEEK_API_KEY（可选）"
    - "docker compose up -d --build"
    - "浏览器打开 http://localhost:5000"

# ---------------------------------------------------------------------------
# 环境测试（冒烟测试）
# ---------------------------------------------------------------------------
test:
  command: docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --abort-on-container-exit
  checks:
    - name: 首页 HTTP 200
      endpoint: GET /
    - name: 历史记录 API
      endpoint: GET /api/history
      expect: success=true
    - name: CSV 上传与审计
      endpoint: POST /api/upload
      file: 示例财务数据.csv
      expect: success=true, audit_summary present
    - name: 仪表盘 API
      endpoint: GET /api/dashboard
      expect: success=true
  expected_output: "全部测试通过"

# ---------------------------------------------------------------------------
# 功能验证清单（手动）
# ---------------------------------------------------------------------------
manual_verification:
  - step: 上传 CSV/Excel 文件
    path: /
    expect: 显示审计预检结果
  - step: 上传表格截图识图
    path: / → 拍照/识图
    expect: 识别表格并统计
  - step: 仪表盘 AI 语音提问
    path: /dashboard
    expect: 麦克风按钮可语音输入并问答
  - step: 历史记录
    path: /history
    expect: 显示已保存的审计记录
