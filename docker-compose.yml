# 财务大数据审计系统 - Docker Compose 部署配置
# 使用方法见下方「快速启动」

services:
  audit-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-audit-system:latest
    container_name: financial-audit
    restart: unless-stopped
    ports:
      - "0.0.0.0:${HOST_PORT:-5000}:5000"
    environment:
      # Flask 运行配置
      PORT: "5000"
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
      BAILIAN_API_KEY: "${BAILIAN_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      CUSTOM_API_KEY: "${CUSTOM_API_KEY:-}"
    volumes:
      # 持久化：上传文件、SQLite 历史记录与搜索索引
      - audit-uploads:/app/uploads
      - audit-data:/app/data
      # Agent 扩展开发目录（本地修改即时生效）
      - ./extensions:/app/extensions
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  audit-uploads:
    driver: local
  audit-data:
    driver: local

# ---------------------------------------------------------------------------
# 快速启动
# ---------------------------------------------------------------------------
# 1. 复制环境变量模板并编辑（可选）:
#      cp .env.example .env
#
# 2. 构建并启动:
#      docker compose up -d --build
#
# 3. 浏览器访问:
#      http://localhost:5000
#
# 4. 查看日志:
#      docker compose logs -f audit-app
#
# 5. 停止服务:
#      docker compose down
#
# 环境验证测试:
#      docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --abort-on-container-exit
